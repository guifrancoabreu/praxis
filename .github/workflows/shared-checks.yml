name: Shared content

on:
  push:
    paths:
      - "shared/**"
      - "design/**"
      - "tools/**"
      - "ios/Praxis/RefTokens.swift"
      - "ios/Praxis/Fonts/**"
      - "ios/Praxis/Assets.xcassets/**"
      - "android/app/src/main/res/**"
      - ".github/workflows/shared-checks.yml"
  pull_request:
    paths:
      - "shared/**"
      - "design/**"
      - "tools/**"
      - "ios/Praxis/RefTokens.swift"
      - "ios/Praxis/Fonts/**"
      - "ios/Praxis/Assets.xcassets/**"
      - "android/app/src/main/res/**"
      - ".github/workflows/shared-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset tooling
        run: python3 -m pip install --quiet pillow
      - name: Catalogs and reader assets live in shared/
        run: python3 tools/check_shared.py
      - name: Design tokens match every platform
        run: python3 tools/gen_tokens.py --check
      - name: Generated assets match shared/assets
        run: python3 tools/sync_assets.py --check
